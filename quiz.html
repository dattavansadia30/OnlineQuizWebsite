
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Quiz | QuizBloom</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="quiz-page">

    <nav class="navbar">
        <a href="index.html" class="logo">Quiz<span>Bloom</span></a>
        <a href="categories.html" class="quiz-exit">Exit Quiz</a>
    </nav>

    <main class="quiz-container">
        <div class="quiz-top">
            <div>
                <p class="quiz-label">YOUR QUIZ IS LIVE ✨</p>
                <h1 id="categoryTitle">Programming Quiz</h1>
                <p>Choose the correct answer for each question.</p>
            </div>

            <div class="timer-box">
                <span>TIME LEFT</span>
                <h2 id="timer">05:00</h2>
            </div>
        </div>

        <div class="quiz-progress">
            <div id="progressFill"></div>
        </div>

        <div class="question-card">
            <div class="question-info">
                <span id="questionNumber">Question 1 of 5</span>
                <span>1 mark each</span>
            </div>

            <h2 id="questionText">Loading question...</h2>

            <div id="optionsContainer" class="options-container"></div>

            <p id="answerMessage" class="answer-message"></p>

            <div class="quiz-buttons">
                <button id="previousBtn" class="secondary-btn" type="button">
                    ← Previous
                </button>

                <button id="nextBtn" class="primary-btn" type="button">
                    Next →
                </button>

                <button id="submitBtn" class="submit-btn" type="button">
                    Submit Quiz
                </button>
            </div>
        </div>

        <p class="quiz-note">
            💗 Your answers are saved as you move between questions.
        </p>
    </main>

    <script src="js/questions.js"></script>

    <script>
        const category = localStorage.getItem("selectedQuizCategory")
            || "Programming";

        const questions = quizQuestions[category] || quizQuestions["Programming"];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);
        let timeLeft = 300;
        let submitted = false;

        const categoryTitle = document.getElementById("categoryTitle");
        const questionNumber = document.getElementById("questionNumber");
        const questionText = document.getElementById("questionText");
        const optionsContainer = document.getElementById("optionsContainer");
        const timer = document.getElementById("timer");
        const progressFill = document.getElementById("progressFill");
        const previousBtn = document.getElementById("previousBtn");
        const nextBtn = document.getElementById("nextBtn");
        const submitBtn = document.getElementById("submitBtn");
        const answerMessage = document.getElementById("answerMessage");

        categoryTitle.textContent = category + " Quiz";

        function showQuestion() {
            const q = questions[currentQuestion];

            questionNumber.textContent =
                "Question " + (currentQuestion + 1) +
                " of " + questions.length;

            questionText.textContent = q.question;
            optionsContainer.innerHTML = "";
            answerMessage.textContent = "";

            q.options.forEach(function(option, index) {
                const label = document.createElement("label");
                label.className = "quiz-option";

                const radio = document.createElement("input");
                radio.type = "radio";
                radio.name = "answer";
                radio.value = index;
                radio.checked = answers[currentQuestion] === index;

                const text = document.createElement("span");
                text.textContent = option;

                radio.addEventListener("change", function() {
                    answers[currentQuestion] = index;
                    updateProgress();
                });

                label.appendChild(radio);
                label.appendChild(text);

                if (radio.checked) {
                    label.classList.add("selected");
                }

                radio.addEventListener("change", function() {
                    document.querySelectorAll(".quiz-option")
                        .forEach(function(item) {
                            item.classList.remove("selected");
                        });

                    label.classList.add("selected");
                });

                optionsContainer.appendChild(label);
            });

            previousBtn.disabled = currentQuestion === 0;

            if (currentQuestion === questions.length - 1) {
                nextBtn.style.display = "none";
                submitBtn.style.display = "inline-block";
            } else {
                nextBtn.style.display = "inline-block";
                submitBtn.style.display = "inline-block";
            }

            updateProgress();
        }

        function updateProgress() {
            const answered = answers.filter(function(answer) {
                return answer !== null;
            }).length;

            progressFill.style.width =
                (answered / questions.length * 100) + "%";
        }

        previousBtn.addEventListener("click", function() {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion();
            }
        });

        nextBtn.addEventListener("click", function() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                showQuestion();
            }
        });

        function submitQuiz() {
            if (submitted) return;
            submitted = true;

            let score = 0;

            questions.forEach(function(question, index) {
                if (answers[index] === question.answer) {
                    score++;
                }
            });

            const result = {
                category: category,
                score: score,
                total: questions.length,
                percentage: Math.round((score / questions.length) * 100),
                date: new Date().toLocaleString(),
                answers: questions.map(function(question, index) {
                    return {
                        question: question.question,
                        options: question.options,
                        correctIndex: question.answer,
                        selectedIndex: answers[index]
                    };
                })
            };

            localStorage.setItem("lastQuizResult", JSON.stringify(result));

            let history = JSON.parse(
                localStorage.getItem("quizHistory") || "[]"
            );

            history.push(result);

            localStorage.setItem("quizHistory", JSON.stringify(history));

            window.location.href = "results.html";
        }

        submitBtn.addEventListener("click", function() {
            const unanswered = answers.filter(function(answer) {
                return answer === null;
            }).length;

            if (unanswered > 0) {
                const confirmSubmit = confirm(
                    "You have " + unanswered +
                    " unanswered question(s). Submit anyway?"
                );

                if (!confirmSubmit) return;
            }

            submitQuiz();
        });

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;

            timer.textContent =
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");

            if (timeLeft <= 30) {
                timer.classList.add("timer-warning");
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                submitQuiz();
                return;
            }

            timeLeft--;
        }

        showQuestion();
        updateTimer();

        const timerInterval = setInterval(updateTimer, 1000);
    </script>

</body>
</html>
